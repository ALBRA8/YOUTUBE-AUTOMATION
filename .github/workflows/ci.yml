name: CI YOUTUBE-AUTOMATION
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # P0-1: un SyntaxError en CUALQUIER .py del repo (incluida launchers/,
      # que antes solo se verificaba por subcadenas) debe romper el CI.
      - name: Sintaxis de todo el repo (compileall, P0-1)
        run: python -m compileall -q -x '\.venv' backend launchers tools tests
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install opencv-python-headless
      - name: Lint critico con ruff (F821, E9, F63, F7, F82)
        run: python -m ruff check --select F821,E9,F63,F7,F82 backend tools
      - name: ffmpeg (exigido en recolección por test_int077_ugc_pacing)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Suite pytest (aislada de .env y con fixes 658740b)
        run: python -m pytest tests/ -q
      # D-010: HANDS está en RESERVA (dormido), pero su código no puede
      # pudrirse: sus 4 baterías son herméticas y corren dentro del paso hermético.
      # Baterías standalone herméticas (P0-2): ejecutan las suites excluidas de pytest
      # en procesos aislados (incluidas las 4 de HANDS, seguridad, gobernanza, etc.).
      # Si cualquiera falla, el job falla (exit != 0).
      # Exclusiones de Linux CI documentadas:
      # - test_live_boot.py: requiere levantar uvicorn en background y ejecutar
      #   scripts bash interactivos contra puertos de red del host.
      # - test_live_execution*.py (c1, c2, 1, 2): scripts de host ligados a la
      #   máquina Windows del usuario (D:\PROYECTOS\...) y sesión viva de Google Chrome.
      - name: Baterías standalone herméticas (P0-2 y D-010 HANDS)
        run: python tests/run_all.py --hermetic
