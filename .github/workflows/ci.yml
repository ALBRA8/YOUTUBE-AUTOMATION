name: CI YOUTUBE-AUTOMATION
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # P0-1: un SyntaxError en CUALQUIER .py del repo (incluida launchers/,
      # que antes solo se verificaba por subcadenas) debe romper el CI.
      - name: Sintaxis de todo el repo (compileall, P0-1)
        run: python -m compileall -q -x '\.venv' backend launchers tools tests
      - name: Instalar dependencias (lockfile exacto — mismo comando que local, P4.2/P4.3)
        run: |
          python -m pip install --upgrade pip
          # P4.3: el CI instala el LOCKFILE con pins exactos verificados —
          # el mismo comando que en la máquina local. Antes el CI instalaba
          # rangos (>=) y podía divergir de lo que corre el operador.
          pip install -r backend/requirements-lock.txt
          pip install -r backend/requirements-dev.txt
      - name: Lint critico con ruff (F821, E9, F63, F7, F82)
        run: python -m ruff check --select F821,E9,F63,F7,F82 backend tools
      - name: ffmpeg (exigido en recolección por test_int077_ugc_pacing)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Suite pytest (aislada de .env y con fixes 658740b)
        run: python -m pytest tests/ -q -n auto  # P6.2: xdist, mismo comando que local
      # D-010: HANDS está en RESERVA (dormido), pero su código no puede
      # pudrirse: sus 4 baterías son herméticas y corren dentro del paso hermético.
      # Baterías standalone herméticas (P0-2): ejecutan las suites excluidas de pytest
      # en procesos aislados (incluidas las 4 de HANDS, seguridad, gobernanza, etc.).
      # Si cualquiera falla, el job falla (exit != 0).
      # Exclusiones de Linux CI documentadas:
      # - test_live_boot.py: requiere levantar uvicorn en background y ejecutar
      #   scripts bash interactivos contra puertos de red del host.
      # - test_live_execution*.py (c1, c2, 1, 2): scripts de host ligados a la
      #   máquina Windows del usuario (D:\PROYECTOS\...) y sesión viva de Google Chrome.
      - name: Baterías standalone herméticas (P0-2 y D-010 HANDS)
        run: python tests/run_all.py --hermetic
      # La batería standalone tests/run_all.py completa requiere entorno Windows
      # (Chrome/perfil, claves de proveedores): se ejecuta en la máquina del propietario.

  # [F8 · V14] EL PRODUCTO es Windows: hasta hoy el CI solo lo veía en un job
  # «exploratorio» (continue-on-error, solo pytest) — los fallos reales de
  # encoding cp1252, PowerShell, rutas con espacios y dependencias del lock
  # eran INVISIBLES. Este job corre la SUITE CANÓNICA (run_all.py) en el
  # entorno objetivo y su resultado es VISIBLE (sin continue-on-error).
  # Python 3.13 y no 3.14: el LOCKFILE no puede subir de 3.13 —
  # numpy==2.1.3 NO publica wheels cp314 (evidencia PyPI medida en el cierre
  # F: cp310..cp313 + cp313t, sin cp314); av 18.1.0 y opencv 4.13.0.90 son
  # abi3 (>=3.11 ok) y ctranslate2/onnxruntime publican cp313. El día que el
  # lock se regenere con numpy>=2.2 (con cp314), subir esta versión.
  # Modo --hermetic (69 baterías): test_live_boot queda para Linux/owner
  # (uvicorn + scripts bash nativos); en Windows corre lo hermético completo.
  ci-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: ffmpeg (exigido en recolección por test_int077_ugc_pacing)
        run: choco install ffmpeg -y --no-progress
      - name: Instalar dependencias (lockfile exacto — P4.2/P4.3)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
          pip install -r backend/requirements-dev.txt
      - name: Sintaxis de todo el repo (compileall, P0-1)
        run: python -m compileall -q -x '\.venv' backend launchers tools tests
      - name: Lint critico con ruff (F821, E9, F63, F7, F82)
        run: python -m ruff check --select F821,E9,F63,F7,F82 backend tools
      - name: Suite pytest en Windows (xdist)
        run: python -m pytest tests/ -q -n auto
      - name: SUITE CANÓNICA run_all en Windows (69 baterías herméticas)
        run: python tests/run_all.py --hermetic
