name: CI YOUTUBE-AUTOMATION
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          # [V12] opencv-python-headless vive en requirements.txt (pin exacto):
          # face_tracker.py y ecommerce_overlays.py lo importan (deferido) y
          # los endpoints de e-commerce fallan con ImportError sin él.
          pip install -r backend/requirements.txt --upgrade-strategy only-if-needed
      - name: ffmpeg (exigido en recolección por test_int077_ugc_pacing)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Suite pytest (aislada de .env y con fixes 658740b)
        run: python -m pytest tests/ -q
      # La batería standalone tests/run_all.py requiere entorno Windows completo
      # (Chrome/perfil, claves de proveedores): se ejecuta en la máquina del propietario.

  # [V14] el PRODUCTO es Windows / Python 3.14 y hasta hoy el CI solo veía
  # ubuntu / 3.12: los fallos de encoding (cp1252), PowerShell y rutas con
  # espacios eran INVISIBLES al CI. Este job replica el entorno objetivo.
  # Exploratorio hasta medirse en verde: continue-on-error para no bloquear
  # el gate requerido "ci" (ubuntu) mientras se estabiliza.
  ci-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg (exigido en recolección por test_int077_ugc_pacing)
        run: choco install ffmpeg -y --no-progress
      - name: Suite pytest en Windows
        run: python -m pytest tests/ -q
