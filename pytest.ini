# pytest — configuración del proyecto (FIX-A, 2026-10-27).
# Convención de dos niveles documentada en tests/README.md:
#   · baterías standalone  → python3 tests/run_all.py (fuente de verdad)
#   · tests pytest nativos → python3 -m pytest tests/ -q
# tests/conftest.py excluye las baterías standalone de la recolección y
# aísla DATA_DIR/TMP_DIR/SQLite del backend en un directorio temporal.
[pytest]
testpaths = tests
asyncio_mode = auto
# .pytest_cache NO está en .gitignore y las baterías de gobernanza hacen
# guardias de alcance git: no dejar caché dentro del repo.
addopts = -p no:cacheprovider
