<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  body { width: 280px; font: 13px/1.5 system-ui, sans-serif; margin: 0;
         background: #0b0d17; color: #eef1ff; }
  .head { padding: 14px; background: linear-gradient(120deg, #7c5cff, #ff5c87);
          font-weight: 800; display: flex; gap: 8px; align-items: center; }
  .body { padding: 14px; display: flex; flex-direction: column; gap: 11px; }
  label { color: #9aa2c8; font-size: 11.5px; font-weight: 700; display: block; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 9px;
          border: 1px solid #ffffff22; background: #161a30; color: #eef1ff; font-size: 12.5px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
         padding: 10px; border-radius: 10px; background: #161a30; border: 1px solid #ffffff14; }
  .switch { width: 40px; height: 22px; border-radius: 999px; background: #2a2f4d;
            position: relative; cursor: pointer; transition: .2s; flex-shrink: 0; }
  .switch::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%;
                   background: #fff; top: 3px; left: 3px; transition: .2s; }
  .switch.on { background: #2bd976; } .switch.on::after { left: 21px; }
  .status { font-size: 11.5px; color: #9aa2c8; min-height: 16px; }
  button { padding: 9px; border-radius: 9px; border: none; cursor: pointer;
           font-weight: 700; background: #7c5cff; color: #fff; }
  b { color: #00e0c6; }
</style>
</head>
<body>
  <div class="head">🎬 YT Automation Bridge</div>
  <div class="body">
    <div>
      <label>PROJECT ID (opcional — para asociar las imágenes a un proyecto)</label>
      <input id="project" placeholder="ej: 727c6fdf5b42">
    </div>
    <div class="row">
      <span><b>Modo AUTO</b><br><span style="color:#9aa2c8;font-size:11px">envía cada imagen nueva sin clic</span></span>
      <div class="switch" id="auto"></div>
    </div>
    <button id="save">💾 Guardar</button>
    <div class="status" id="status">Abre labs.google/fx, genera imágenes y pulsa «➤ Enviar».</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
