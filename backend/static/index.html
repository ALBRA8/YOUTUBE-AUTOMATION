<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Automation v2.0 — Fábrica de videos IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css?v=2.11.0">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <!-- marca -->
    <div class="brand" onclick="nav('home')" title="Ir al inicio">
      <div class="logo">🚀</div>
      <h1>AI <em>AUTOMATION</em><small>FÁBRICA DE VIDEOS · $0</small></h1>
    </div>

    <!-- navegación (v2.10.2: sin CTA de nicho ni explorador — los proyectos
         viven en la vista 🗂️ Proyectos, organizados en árbol de nichos) -->
    <nav class="side-nav">
      <div class="nav-item" data-view="home"><span class="ico">🏠</span> Inicio</div>
      <div class="nav-item" data-view="agent"><span class="ico">🤖</span> Agente</div>
    </nav>

    <!-- herramientas -->
    <div class="side-tools">
      <button class="sidebar-nav-btn" onclick="nav('create')"><span class="ico">✨</span> Crear</button>
      <button class="sidebar-nav-btn" onclick="nav('avatars')"><span class="ico">🎭</span> Avatares</button>
      <button class="sidebar-nav-btn" onclick="nav('projects')"><span class="ico">🗂️</span> Proyectos</button>
      <button class="sidebar-nav-btn" onclick="nav('factory')"><span class="ico">🏭</span> Fábrica</button>
      <button class="sidebar-nav-btn" onclick="nav('publish')"><span class="ico">📺</span> Publicar</button>
      <button class="sidebar-nav-btn" onclick="nav('trends')"><span class="ico">🔥</span> Tendencias</button>
    </div>

    <!-- pie: ajustes + coste (una línea) -->
    <div class="sidebar-footer">
      <div class="nav-item" data-view="settings"><span class="ico">⚙️</span> Ajustes</div>
      <span class="cost-chip" id="cost-chip" title="Coste acumulado — todo corre con APIs gratuitas">💚 $0.00</span>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="greet" id="greet">Hola 👋<small id="greet-sub">Tu fábrica de videos con IA</small></div>
      <span class="pill" id="pill-gemini"><span class="dot"></span> Gemini</span>
      <span class="pill" id="pill-whisper"><span class="dot"></span> Whisper</span>
      <span class="pill" id="pill-yt"><span class="dot"></span> YouTube</span>
      <button class="icon-btn" id="theme-btn" title="Tema claro/oscuro">🌙</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="overlay-root"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="static/auth.js?v=2.5.0"></script>
<script src="static/app.js?v=2.11.0"></script>
</body>
</html>
